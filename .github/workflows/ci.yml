name: CI

permissions:
  actions: write
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ###########################################################################
  # 0a. Warm submodule cache (one save per OS — Actions cache is OS-scoped)
  ###########################################################################
  checkout-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm repository + submodule cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

  ###########################################################################
  # 0b. Warm APT lists only (Linux builds)
  ###########################################################################
  apt-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    name: apt-bootstrap (${{ matrix.runner }})
    steps:
      - name: Warm APT package indexes
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists

  ###########################################################################
  # LINUX
  ###########################################################################
  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
        libc: [glibc, musl]
        toolchain:
          - compiler: gcc
            stdlib: libstdc++
          - compiler: clang
            stdlib: libc++
        extra: [ON, OFF]
        include:
          - platform:
              runner: ubuntu-26.04
              arch: amd64
            libc: glibc
            toolchain:
              compiler: clang
              stdlib: libstdc++
            extra: ON
          - platform:
              runner: ubuntu-26.04
              arch: amd64
            libc: glibc
            toolchain:
              compiler: clang
              stdlib: libstdc++
            extra: OFF
    runs-on: ${{ matrix.platform.runner }}
    name: linux-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}-extra(${{ matrix.extra }})
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Append. Assigning the variable would drop a path already set.
          add_dir() {
            local name="$1" dir="$2" current
            current="$(printenv "$name" || true)"
            case ":${current}:" in
              *":${dir}:"*) return 0 ;;
            esac
            if [[ -n "$current" ]]; then
              current="${current}:${dir}"
            else
              current="${dir}"
            fi
            export "${name}=${current}"
            echo "${name}=${current}" >> "$GITHUB_ENV"
          }
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib"
            add_dir "$name" "${{ github.workspace }}/build/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib64"
          done

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          cxx-stdlib: ${{ matrix.toolchain.stdlib }}
          libc: ${{ matrix.libc }}
          compiler-cache-key: multimedia-v1
          compiler-cache-scope: ${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}-extra-${{ matrix.extra }}
          buildmaster-cache-key: bm-multimedia-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}-extra-${{ matrix.extra }}
          # Alpine already ships nasm/yasm; VMAF needs vim's xxd, BusyBox xxd
          # rejects the output-file argument.
          extra-packages: ${{ matrix.libc == 'musl' && 'xxd' || (matrix.platform.arch == 'amd64' && 'nasm yasm' || '') }}
          build-type: ${{ env.BUILD_TYPE }}
          pgo: false
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DENABLE_CI_FIXTURES=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_TESSDATA=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_ZIMG=BUNDLED
            -DWITH_EBUR128=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
            -DBUILD_SHARED_LIBS=ON
          ctest: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # macOS
  ###########################################################################
  build-macos:
    needs: [checkout-bootstrap]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang]
        extra: [ON, OFF]
    name: macos-${{ matrix.compiler }}-extra(${{ matrix.extra }})

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Append. Assigning the variable would drop a path already set.
          add_dir() {
            local name="$1" dir="$2" current
            current="$(printenv "$name" || true)"
            case ":${current}:" in
              *":${dir}:"*) return 0 ;;
            esac
            if [[ -n "$current" ]]; then
              current="${current}:${dir}"
            else
              current="${dir}"
            fi
            export "${name}=${current}"
            echo "${name}=${current}" >> "$GITHUB_ENV"
          }
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            add_dir "$name" "${{ github.workspace }}/build/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib64"
          done

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: ${{ matrix.compiler }}
          compiler-cache-key: multimedia-v1
          compiler-cache-scope: macos-${{ matrix.compiler }}-extra-${{ matrix.extra }}
          buildmaster-cache-key: bm-multimedia-macos-${{ matrix.compiler }}-extra-${{ matrix.extra }}
          build-type: ${{ env.BUILD_TYPE }}
          pgo: false
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DENABLE_CI_FIXTURES=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_TESSDATA=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_ZIMG=BUNDLED
            -DWITH_EBUR128=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
            -DBUILD_SHARED_LIBS=ON
          ctest: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # WINDOWS
  ###########################################################################
  build-windows:
    needs: [checkout-bootstrap]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [ON, OFF]
    name: windows-clang-cl-extra(${{ matrix.extra }})

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: clang-cl
          compiler-cache-key: multimedia-v1
          compiler-cache-scope: windows-clang-cl-extra-${{ matrix.extra }}
          buildmaster-cache-key: bm-multimedia-windows-clang-cl-extra-${{ matrix.extra }}
          extra-packages: nasm
          build-type: ${{ env.BUILD_TYPE }}
          pgo: false
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DENABLE_CI_FIXTURES=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_TESSDATA=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_ZIMG=BUNDLED
            -DWITH_EBUR128=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
            -DBUILD_SHARED_LIBS=ON
          ctest: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test
