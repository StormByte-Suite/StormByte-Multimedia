name: CI

permissions:
  actions: write
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  ###########################################################################
  # 0a. Warm submodule cache (one save per OS — Actions cache is OS-scoped)
  ###########################################################################
  checkout-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm repository + submodule cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

  ###########################################################################
  # 0b. Warm APT lists only (Linux builds)
  ###########################################################################
  apt-bootstrap:
    runs-on: ubuntu-26.04
    name: apt-bootstrap
    steps:
      - name: Warm APT package indexes
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists

  ###########################################################################
  # LINUX
  ###########################################################################
  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, clang-libc++]
        extra: [ON, OFF]
    name: linux-${{ matrix.compiler }}-extra(${{ matrix.extra }})
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install nasm/yasm (bundled FFmpeg)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: "nasm yasm"
          cache-key: apt-nasm-yasm
          lists-cache-key: apt-lists
          rotate-weekly: true

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Append. Assigning the variable would drop a path already set.
          add_dir() {
            local name="$1" dir="$2"
            local current="${!name-}"
            case ":${current}:" in
              *":${dir}:"*) return 0 ;;
            esac
            if [[ -n "$current" ]]; then
              export "${name}=${current}:${dir}"
            else
              export "${name}=${dir}"
            fi
            echo "${name}=${!name}" >> "$GITHUB_ENV"
          }
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib"
            add_dir "$name" "${{ github.workspace }}/build/lib"
          done

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          version: ${{ matrix.compiler == 'gcc' && '15' || '' }}
          ccache-key: v1-${{ matrix.compiler }}-extra-${{ matrix.extra }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_LTO=ON
            -DENABLE_PGO=OFF
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_TESSDATA=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_CXX_STANDARD_LIBRARIES=-stdlib=libc++' || '' }}
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # macOS
  ###########################################################################
  build-macos:
    needs: [checkout-bootstrap]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang]
        extra: [ON, OFF]
    name: macos-${{ matrix.compiler }}-extra(${{ matrix.extra }})

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Append. Assigning the variable would drop a path already set.
          add_dir() {
            local name="$1" dir="$2"
            local current="${!name-}"
            case ":${current}:" in
              *":${dir}:"*) return 0 ;;
            esac
            if [[ -n "$current" ]]; then
              export "${name}=${current}:${dir}"
            else
              export "${name}=${dir}"
            fi
            echo "${name}=${!name}" >> "$GITHUB_ENV"
          }
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            add_dir "$name" "${{ github.workspace }}/build/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib64"
          done

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1-${{ matrix.compiler }}-extra-${{ matrix.extra }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_LTO=ON
            -DENABLE_PGO=OFF
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_TESSDATA=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
          run-tests: ${{ matrix.extra == 'OFF' }}
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

      # extras ON segfaults in pipeline.test_hevc_av1_hevc_hdr10plus after the
      # elementary HEVC session prints "assert count == 48". The rest of the
      # suite is not run here: one traced crash is the point of this job.
      # Homebrew gdb cannot attach on a hosted runner (SIP denies the Mach
      # task port). lldb is the debugger that can stop the signal.
      - name: Trace the HDR10+ elementary HEVC crash
        if: matrix.extra == 'ON'
        shell: bash
        run: |
          set -euo pipefail
          brew install gdb

          lib_path="${GITHUB_WORKSPACE}/build/lib:${GITHUB_WORKSPACE}/build/buildmaster/install/lib:${GITHUB_WORKSPACE}/build/buildmaster/install/lib64"
          export DYLD_LIBRARY_PATH="${lib_path}${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"
          export DYLD_FALLBACK_LIBRARY_PATH="${DYLD_LIBRARY_PATH}"

          exe=""
          while IFS= read -r candidate; do
            exe="${candidate}"
            break
          done < <(find "${GITHUB_WORKSPACE}/build" -type f -name MultimediaPipelineHdr10PlusTests)
          if [[ -z "${exe}" ]]; then
            cmake --build "${GITHUB_WORKSPACE}/build" --target MultimediaPipelineHdr10PlusTests --parallel
            while IFS= read -r candidate; do
              exe="${candidate}"
              break
            done < <(find "${GITHUB_WORKSPACE}/build" -type f -name MultimediaPipelineHdr10PlusTests)
          fi
          if [[ -z "${exe}" ]]; then
            echo "MultimediaPipelineHdr10PlusTests was not built" >&2
            exit 1
          fi
          echo "EXE=${exe}"
          otool -L "${exe}"

          echo "===== gdb: stop at main, then quit (attach probe, not the full run) ====="
          python3 - "${exe}" << 'PY' || true
          import subprocess, sys
          exe = sys.argv[1]
          try:
              done = subprocess.run(
                  ["gdb", "--batch",
                   "-ex", "set pagination off",
                   "-ex", "set startup-with-shell off",
                   "-ex", "start",
                   "-ex", "info registers",
                   "-ex", "bt",
                   "-ex", "quit",
                   "--args", exe, "test_hevc_av1_hevc_hdr10plus"],
                  timeout=30)
              print("gdb exit", done.returncode)
          except subprocess.TimeoutExpired:
              print("gdb timed out")
          PY

          python3 - "${exe}" "${DYLD_LIBRARY_PATH}" "${RUNNER_TEMP}" << 'PY'
          import pathlib, sys
          exe, lib_path, temp = sys.argv[1:]
          path = pathlib.Path(temp) / "hdr10.lldb"
          path.write_text(
              "settings set auto-confirm true\n"
              "settings set target.inherit-env true\n"
              f"settings set target.env-vars DYLD_LIBRARY_PATH={lib_path} DYLD_FALLBACK_LIBRARY_PATH={lib_path}\n"
              f"target create {exe}\n"
              "settings set -- target.run-args test_hevc_av1_hevc_hdr10plus\n"
              "process launch\n"
              "thread backtrace all\n"
              "register read\n"
              "image lookup -a $pc\n"
              "disassemble -p -c 24\n"
              "quit\n"
          )
          PY

          set +e
          lldb --batch -s "${RUNNER_TEMP}/hdr10.lldb"
          lldb_status=$?
          set -e
          echo "lldb exit ${lldb_status}"
          exit 1

  ###########################################################################
  # WINDOWS
  ###########################################################################
  build-windows:
    needs: [checkout-bootstrap]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [ON, OFF]
    name: windows-clang-cl-extra(${{ matrix.extra }})

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install nasm (bundled FFmpeg)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: nasm

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: clang-cl
          ccache-key: v1-clang-cl-extra-${{ matrix.extra }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_LTO=ON
            -DENABLE_PGO=OFF
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_TESSDATA=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test
