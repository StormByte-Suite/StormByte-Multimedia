name: CI

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  ###########################################################################
  # 0a. Warm submodule cache (one save per OS — Actions cache is OS-scoped)
  ###########################################################################
  checkout-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm repository + submodule cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

  ###########################################################################
  # 0b. Warm APT lists only (Linux + docs)
  ###########################################################################
  apt-bootstrap:
    runs-on: ubuntu-26.04
    name: apt-bootstrap
    steps:
      - name: Warm APT package indexes
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists

  ###########################################################################
  # LINUX
  ###########################################################################
  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, clang-libc++]
        extra: [ON, OFF]
    name: linux-${{ matrix.compiler }}-extra(${{ matrix.extra }})
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/thirdparty/buildmaster/install/lib:${{ github.workspace }}/build/lib

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install nasm/yasm (bundled FFmpeg)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: "nasm yasm"
          cache-key: apt-nasm-yasm
          lists-cache-key: apt-lists
          rotate-weekly: true

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          version: ${{ matrix.compiler == 'gcc' && '15' || '' }}
          ccache-key: v1-${{ matrix.compiler }}-extra-${{ matrix.extra }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # macOS
  ###########################################################################
  build-macos:
    needs: [checkout-bootstrap]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang]
        extra: [ON, OFF]
    name: macos-${{ matrix.compiler }}-extra(${{ matrix.extra }})

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1-${{ matrix.compiler }}-extra-${{ matrix.extra }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # WINDOWS
  ###########################################################################
  build-windows:
    needs: [checkout-bootstrap]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [ON, OFF]
    name: windows-clang-cl-extra(${{ matrix.extra }})

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install nasm (bundled FFmpeg)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: nasm

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\thirdparty\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: clang-cl
          ccache-key: v1-clang-cl-extra-${{ matrix.extra }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
            "-DCMAKE_C_FLAGS=/W3 /wd4244 /wd4267 /wd4996 /wd4065 /D_CRT_SECURE_NO_WARNINGS /D_WIN32_WINNT=0x0A00 /EHsc"
            "-DCMAKE_CXX_FLAGS=/W3 /wd4244 /wd4267 /wd4996 /wd4065 /D_CRT_SECURE_NO_WARNINGS /D_WIN32_WINNT=0x0A00 /EHsc"
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # DOCS (master push / manual only)
  #
  # generate-and-deploy-docs.yml extra-install is archive apt only.
  # Ubuntu still ships FFmpeg < 9.0.0; WITH_FFMPEG=SYSTEM is a hard
  # CMake error. Restore the reusable job when archive ffmpeg >= 9
  # and delete the inline job below.
  ###########################################################################
  # docs:
  #   needs: [checkout-bootstrap, apt-bootstrap]
  #   if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
  #   uses: stormbytepp/githubactions/.github/workflows/generate-and-deploy-docs.yml@master
  #   permissions:
  #     contents: read
  #     pages: write
  #     id-token: write
  #     actions: write
  #   with:
  #     doc_target: StormByteMultimediaDoc
  #     extra-cmake-options: -DENABLE_DOC=ON -DWITH_STORMBYTE=BUNDLED -DWITH_FFMPEG=SYSTEM -DWITH_VMAF=BUNDLED
  #     extra-install: "ffmpeg libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev nasm"
  #     docs_output_dir: ./_site

  docs:
    needs: [checkout-bootstrap, apt-bootstrap]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install toolchain (docs)
        id: toolchain
        uses: stormbytepp/githubactions/.github/actions/install-toolchain@master
        with:
          toolchain: clang
          docs: true

      # Temporary: official Ubuntu FFmpeg is < 9. Remove this step when
      # apt ffmpeg >= 9.0.0 and switch back to the reusable workflow.
      - name: FFmpeg 9 PPA (until Ubuntu archives it)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg9
          sudo apt-get update

      - name: Install extra packages
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: "ffmpeg libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev nasm"
          cache-key: extra-apt-packages-ffmpeg9-docs
          lists-cache-key: apt-lists

      - name: Configure CMake
        run: |
          set -euo pipefail
          cmake -S . -B "${{ github.workspace }}/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${{ steps.toolchain.outputs.c_compiler }}" \
            -DCMAKE_CXX_COMPILER="${{ steps.toolchain.outputs.cxx_compiler }}" \
            -DENABLE_DOC=ON \
            -DWITH_STORMBYTE=BUNDLED \
            -DWITH_FFMPEG=SYSTEM \
            -DWITH_VMAF=BUNDLED

      - name: Build documentation target
        run: |
          set -euo pipefail
          cmake --build "${{ github.workspace }}/build" \
            --target StormByteMultimediaDoc \
            --parallel

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
