name: Release

# Manual only, on a tag. Each build installs and uploads its own ZIP.
# Releases use the redistributable configuration: all dependencies BUNDLED,
# WITH_GPL=OFF and WITH_NONFREE=OFF, with PGO and LTO.
# Docs are deployed independently for this tag.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Selected ref is '${{ github.ref_name }}'. Run this workflow on a tag, not on master."
            exit 1
          fi
          echo "Release tag: ${{ github.ref_name }}"

  checkout-bootstrap:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm repository + submodule cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

  apt-bootstrap:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    name: apt-bootstrap (${{ matrix.runner }})
    steps:
      - name: Warm APT package indexes
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists

  ###########################################################################
  # Linux: amd64/arm64 x glibc/musl x GCC/libstdc++ or Clang/libc++.
  # Name: <component>-<tag>-linux-<arch>-<libc>-<stdlib>.zip
  ###########################################################################
  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    permissions:
      actions: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
        libc: [glibc, musl]
        toolchain:
          - compiler: gcc
            stdlib: libstdc++
          - compiler: clang
            stdlib: libc++
    runs-on: ${{ matrix.platform.runner }}
    name: linux-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.stdlib }}
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          extra="/usr/lib/llvm-22/lib:${{ github.workspace }}/build/pgo-instr/lib:${{ github.workspace }}/build/pgo-instr/buildmaster/install/lib:${{ github.workspace }}/build/pgo-instr/buildmaster/install/lib64:${{ github.workspace }}/build/lib:${{ github.workspace }}/build/buildmaster/install/lib:${{ github.workspace }}/build/buildmaster/install/lib64"
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            current="$(printenv "$name" 2>/dev/null || true)"
            if [[ -n "${current}" ]]; then
              echo "${name}=${extra}:${current}" >> "$GITHUB_ENV"
            else
              echo "${name}=${extra}" >> "$GITHUB_ENV"
            fi
          done

      - name: Build and deploy with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          cxx-stdlib: ${{ matrix.toolchain.stdlib }}
          libc: ${{ matrix.libc }}
          compiler-cache-key: multimedia-v1
          compiler-cache-scope: release-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
          buildmaster-cache-key: bm-multimedia-release-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
          # Alpine already ships nasm/yasm; VMAF needs vim's xxd, BusyBox xxd
          # rejects the output-file argument.
          extra-packages: ${{ matrix.libc == 'musl' && 'xxd' || (matrix.platform.arch == 'amd64' && 'nasm yasm' || '') }}
          build-type: ${{ env.BUILD_TYPE }}
          pgo: true
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_TESSDATA=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_ZIMG=BUNDLED
            -DWITH_EBUR128=BUNDLED
            -DWITH_NONFREE=OFF
            -DWITH_GPL=OFF
            -DBUILD_SHARED_LIBS=ON
          ctest: false
          install-prefix: package
          deploy: true

  ###########################################################################
  # macOS: Apple Clang only, BUNDLED.
  ###########################################################################
  build-macos:
    needs: [checkout-bootstrap]
    permissions:
      actions: write
      contents: write
    runs-on: macos-latest
    name: macos
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          extra="${{ github.workspace }}/build/lib:${{ github.workspace }}/build/buildmaster/install/lib:${{ github.workspace }}/build/buildmaster/install/lib64"
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            current="$(printenv "$name" 2>/dev/null || true)"
            if [[ -n "${current}" ]]; then
              echo "${name}=${extra}:${current}" >> "$GITHUB_ENV"
            else
              echo "${name}=${extra}" >> "$GITHUB_ENV"
            fi
          done

      - name: Build and deploy with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: clang
          compiler-cache-key: multimedia-v1
          compiler-cache-scope: release-macos-clang
          buildmaster-cache-key: bm-multimedia-release-macos-clang
          build-type: ${{ env.BUILD_TYPE }}
          pgo: true
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_TESSDATA=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_ZIMG=BUNDLED
            -DWITH_EBUR128=BUNDLED
            -DWITH_NONFREE=OFF
            -DWITH_GPL=OFF
            -DBUILD_SHARED_LIBS=ON
          ctest: false
          install-prefix: package
          deploy: true

  ###########################################################################
  # Windows: clang-cl, BUNDLED.
  ###########################################################################
  build-windows:
    needs: [checkout-bootstrap]
    permissions:
      actions: write
      contents: write
    runs-on: windows-latest
    name: windows-clang-cl
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and deploy with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: clang-cl
          compiler-cache-key: multimedia-v1
          compiler-cache-scope: release-windows-clang-cl
          buildmaster-cache-key: bm-multimedia-release-windows-clang-cl
          extra-packages: nasm
          build-type: ${{ env.BUILD_TYPE }}
          pgo: true
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_OCR=BUNDLED
            -DWITH_TESSDATA=BUNDLED
            -DWITH_VMAF=BUNDLED
            -DWITH_ZIMG=BUNDLED
            -DWITH_EBUR128=BUNDLED
            -DWITH_NONFREE=OFF
            -DWITH_GPL=OFF
            -DBUILD_SHARED_LIBS=ON
          ctest: false
          install-prefix: package
          deploy: true

  docs:
    needs: [guard, checkout-bootstrap, apt-bootstrap]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install toolchain (docs)
        id: toolchain
        uses: stormbytepp/githubactions/.github/actions/install-toolchain@master
        with:
          toolchain: clang
          docs: true

      # Ubuntu's FFmpeg is older than the 9.0.2 required by SYSTEM mode.
      - name: FFmpeg 9.0.2 from ppa:ubuntuhandbook1/ffmpeg9
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg9
          sudo apt-get update

      - name: Install extra packages
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: "ffmpeg libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev libvmaf-dev libzimg-dev libebur128-dev libtesseract-dev libleptonica-dev tesseract-ocr-eng nasm"
          cache-key: extra-apt-packages-ffmpeg9-system-deps-docs
          lists-cache-key: apt-lists

      - name: Configure CMake
        run: |
          set -euo pipefail
          cmake -S . -B "${{ github.workspace }}/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${{ steps.toolchain.outputs.c_compiler }}" \
            -DCMAKE_CXX_COMPILER="${{ steps.toolchain.outputs.cxx_compiler }}" \
            -DENABLE_DOC=ON \
            -DWITH_STORMBYTE=BUNDLED \
            -DWITH_FFMPEG=SYSTEM \
            -DWITH_VMAF=SYSTEM \
            -DWITH_OCR=SYSTEM \
            -DWITH_TESSDATA=BUNDLED \
            -DWITH_ZIMG=SYSTEM \
            -DWITH_EBUR128=SYSTEM \
            -DWITH_NONFREE=OFF \
            -DWITH_GPL=OFF

      - name: Build documentation target
        run: |
          set -euo pipefail
          cmake --build "${{ github.workspace }}/build" \
            --target StormByteMultimediaDoc \
            -j"$(nproc)"

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
